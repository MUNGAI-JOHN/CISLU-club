<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CISLU Membership</title>
    <link rel="stylesheet" href="membership.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>CISLU Membership</h1>
      <p class="tagline">Connecting Minds, Creating Solutions</p>
    </header>

    <!-- Membership Form -->
    <section class="form-container">
      <h2>Join the Computing & Innovation Society Of Laikipia University</h2>
      <form action="backend/register.php" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="regno">Registration Number:</label>
        <input type="text" id="regno" name="regno" required />

        <label for="dept">Phone NO:</label>
        <input type="text" id="dept" name="dept" required />

        <label for="dept">Department:</label>
        <input type="text" id="dept" name="dept" required />

        <label for="year">Year of Study:</label>
        <select id="year" name="year" required>
          <option value="">--Select Year--</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>

        <label for="membership">Membership Type:</label>
        <select id="membership" name="membership" required>
          <option value="">--Choose Type--</option>
          <option value="regular">Ordinary Member</option>
          <option value="premium">Honorary Member</option>
        </select>

        <button type="submit">Join Now & Pay</button>
      </form>
    </section>
  </body>
</html>
